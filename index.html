<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rushton Garris | Software Engineer</title>
  <meta name="description" content="Portfolio of Rushton Garris, a Software Engineering student at UNC Wilmington building mobile apps, bots, and web projects.">
  <meta name="theme-color" content="#f4eee0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rushton Garris | Software Engineer">
  <meta property="og:description" content="Software Engineering student at UNC Wilmington building mobile apps, bots, and web projects.">
  <meta property="og:url" content="https://rushgarris.github.io/">
  <meta property="og:image" content="https://rushgarris.github.io/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Apply a saved theme before first paint to avoid a flash
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="nav__brand" href="#top">RG</a>
    <div class="nav__right">
      <nav class="nav__links" aria-label="Sections">
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow reveal"><span id="location"></span> · <span id="availability"></span></p>
      <h1 class="hero__name reveal" id="name"></h1>
      <p class="hero__role reveal" id="role"></p>
      <p class="hero__blurb reveal" id="blurb"></p>
      <div class="hero__cta reveal">
        <a class="btn btn--solid" href="#projects">See my projects</a>
        <a class="btn btn--ghost" href="#contact">Get in touch</a>
      </div>
    </section>

    <section id="skills" class="section">
      <h2 class="section__title reveal">Skills</h2>
      <div class="skills" id="skills-list"></div>
    </section>

    <section id="projects" class="section">
      <h2 class="section__title reveal">Projects</h2>
      <div class="projects" id="projects-list"></div>
    </section>

    <section id="experience" class="section">
      <h2 class="section__title reveal">Experience</h2>
      <div class="timeline" id="experience-list"></div>
    </section>

    <section id="contact" class="section contact">
      <h2 class="section__title reveal">Let's talk</h2>
      <p class="contact__text reveal">I'm looking for a software engineering internship for summer 2027. The fastest way to reach me is email.</p>
      <div class="contact__links reveal" id="contact-links"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-text"></span>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
